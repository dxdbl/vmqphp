<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="format-detection" content="telephone=no">
    <title>当前支付方式暂时故障，请使用其他支付方式</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f5f7fa;
            color: #1f2937;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        .notice {
            width: 100%;
            max-width: 460px;
            padding: 40px 28px 32px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 12px 32px rgba(31, 41, 55, .08);
            text-align: center;
        }

        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #fff4e5;
            color: #d97706;
            font-size: 34px;
            line-height: 1;
        }

        h1 {
            margin: 24px 0 12px;
            font-size: 24px;
            font-weight: 600;
        }

        p {
            margin: 0;
            color: #6b7280;
            font-size: 15px;
            line-height: 1.8;
        }

        .tip {
            margin-top: 8px;
            font-size: 14px;
        }

        button {
            width: 100%;
            max-width: 240px;
            height: 44px;
            margin-top: 28px;
            border: 0;
            border-radius: 6px;
            background: #1677ff;
            color: #ffffff;
            cursor: pointer;
            font-size: 15px;
        }

        button:active {
            background: #0958d9;
        }

        button.secondary {
            margin-top: 12px;
            border: 1px solid #d1d5db;
            background: #ffffff;
            color: #4b5563;
        }

        button.secondary:active {
            background: #f3f4f6;
        }
    </style>
</head>
<body>
    <main class="notice" role="status">
        <div class="icon" aria-hidden="true">!</div>
        <h1>当前支付方式暂时故障<br>请使用其他支付方式</h1>
        <p class="tip">您可以选择过段时间重试，<br>我们发现故障后会尽量在第一时间修复！</p>
        <button type="button" onclick="window.close()">关闭本页面</button>
        <button type="button" class="secondary" onclick="history.back()">返回上一页</button>
    </main>
</body>
</html>
