<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>登录</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: #1b1f22;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        .login-form {
            width: 100%;
            max-width: 360px;
        }

        .login-form input {
            display: block;
            width: 100%;
            height: 44px;
            margin-bottom: 14px;
            padding: 0 14px;
            border: 1px solid rgba(255, 255, 255, .7);
            border-radius: 4px;
            outline: 0;
            background: transparent;
            color: #ffffff;
            font-size: 15px;
        }

        .login-form input:focus {
            border-color: #ffffff;
            box-shadow: 0 0 0 1px #ffffff;
        }

        .login-form input::placeholder {
            color: rgba(255, 255, 255, .65);
        }

        .login-form button {
            display: block;
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 4px;
            background: #ffffff;
            color: #1b1f22;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        .login-form button:active {
            background: #dddddd;
        }
    </style>
</head>
<body>
<form class="login-form" onsubmit="return login(event);">
    <input type="text" name="user" id="user" placeholder="账号" aria-label="账号" autocomplete="username" required>
    <input type="password" name="pass" id="pass" placeholder="密码" aria-label="密码" autocomplete="current-password" required>
    <button type="submit">登录</button>
</form>

<script>
    function login(event) {
        event.preventDefault();

        var request = new XMLHttpRequest();
        var user = document.getElementById('user').value;
        var pass = document.getElementById('pass').value;

        request.open('POST', 'login', true);
        request.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
        request.onreadystatechange = function () {
            if (request.readyState !== 4) {
                return;
            }

            if (request.status < 200 || request.status >= 300) {
                alert('登录请求失败，请稍后重试');
                return;
            }

            try {
                var data = JSON.parse(request.responseText);
                if (data.code == 1) {
                    window.location.href = 'aaa.html';
                } else {
                    alert(data.msg);
                }
            } catch (error) {
                alert('登录响应异常，请稍后重试');
            }
        };
        request.send('user=' + encodeURIComponent(user) + '&pass=' + encodeURIComponent(pass));

        return false;
    }
</script>
</body>
</html>
